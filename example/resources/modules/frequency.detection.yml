# Launch a single frequency agent for every
# new http data
---
class_name:     be.cylab.mark.detection.Frequency
label:          detection.http.frequency
description:    detection through translation of time series to frequency domains, focused on detecting periodicity in connections
trigger_label:  data.http
parameters: {
  time_window: 86400,
  relative_value_0: 1.0,
  relative_value_1: 3.0,
  min_raw_data: 50,
  sampling_interval: 30,
  threshold_coeficient: 6.0
}
